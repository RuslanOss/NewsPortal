version: '3.8'
services:
  db:
    image: postgres:15-alpine
    volumes: [postgres_data:/var/lib/postgresql/data]
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME:-newsportal_db}
      POSTGRES_USER: ${DB_USER:-newsportal_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newsportal_pass}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-newsportal_user} -d ${DB_NAME:-newsportal_db}"]
      interval: 10s; timeout: 5s; retries: 5
  web:
    build: .
    volumes: [static_volume:/app/static, media_volume:/app/media]
    env_file: .env
    depends_on: [db]
    restart: unless-stopped
  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/static
      - media_volume:/media
    ports: ["80:80"]
    depends_on: [web]
    restart: unless-stopped
volumes: {postgres_data:, static_volume:, media_volume:}
