{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-form">
    <h1><i class="fas fa-user-plus"></i> Регистрация</h1>
    <form method="post">{% csrf_token %}{{ form.as_p }}
        <button type="submit" class="btn btn-primary"><i class="fas fa-user-plus"></i> Зарегистрироваться</button>
    </form>
    <p class="auth-link">Уже есть аккаунт? <a href="{% url 'login' %}">Войдите</a></p>
</div>
{% endblock %}
