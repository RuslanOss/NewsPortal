{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-form">
    <h1><i class="fas fa-sign-in-alt"></i> Вход</h1>
    <form method="post">{% csrf_token %}{{ form.as_p }}
        <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Войти</button>
    </form>
    <p class="auth-link">Нет аккаунта? <a href="{% url 'signup' %}">Зарегистрируйтесь</a></p>
</div>
{% endblock %}
