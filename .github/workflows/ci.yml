name: CI
on: {push: {branches: [main]}, pull_request: {branches: [main]}}
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install flake8 && pip install -r requirements.txt
      - run: flake8 NewsPaper/ --count --select=E9,F63,F7,F82 --show-source --statistics
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t newsportal .
